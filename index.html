<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Spending Calculator</title>
    <script>
      tailwind = {
        config: {
          darkMode: 'class',
          theme: {
            extend: {
              boxShadow: {
                card: '0 12px 28px -15px rgba(15, 23, 42, 0.35)'
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="h-full bg-slate-100 text-slate-800 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">
    <div class="min-h-full">
      <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
          <div>
            <h1 class="text-xl font-bold tracking-tight sm:text-2xl">Student Spending Calculator</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Track spending, savings, and smarter habits.</p>
          </div>
          <button id="darkModeToggle" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700">
            Toggle Dark Mode
          </button>
        </div>
      </header>

      <main class="mx-auto grid w-full max-w-7xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-3 lg:px-8">
        <section class="space-y-6 lg:col-span-2">
          <article class="rounded-2xl bg-white p-5 shadow-card dark:bg-slate-900">
            <div class="mb-4 flex items-center justify-between">
              <h2 class="text-lg font-semibold">Income</h2>
              <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300">Monthly</span>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="space-y-1">
                <span class="block text-sm font-medium text-slate-600 dark:text-slate-300">Pocket Money / Income</span>
                <input id="incomeInput" type="number" min="0" step="0.01" placeholder="0.00" class="w-full rounded-xl border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-blue-900" />
              </label>
              <label class="space-y-1">
                <span class="block text-sm font-medium text-slate-600 dark:text-slate-300">Extra Income (optional)</span>
                <input id="extraIncomeInput" type="number" min="0" step="0.01" placeholder="0.00" class="w-full rounded-xl border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-blue-900" />
              </label>
            </div>
          </article>

          <article class="rounded-2xl bg-white p-5 shadow-card dark:bg-slate-900">
            <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
              <h2 class="text-lg font-semibold">Expenses</h2>
              <div class="flex gap-2">
                <button id="addCategoryButton" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-500">Add Category</button>
                <button id="resetButton" class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">Reset Data</button>
                <button id="exportButton" class="rounded-xl bg-slate-700 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-600">Export CSV</button>
              </div>
            </div>
            <div id="categoriesContainer" class="space-y-3"></div>
          </article>

          <article class="rounded-2xl bg-white p-5 shadow-card dark:bg-slate-900">
            <h2 class="mb-4 text-lg font-semibold">Charts</h2>
            <div class="grid gap-6 xl:grid-cols-2">
              <div class="rounded-xl border border-slate-200 p-4 dark:border-slate-700">
                <h3 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Expenses by Category</h3>
                <canvas id="pieChart" height="220"></canvas>
              </div>
              <div class="rounded-xl border border-slate-200 p-4 dark:border-slate-700">
                <h3 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Income vs Expenses</h3>
                <canvas id="barChart" height="220"></canvas>
              </div>
            </div>
          </article>
        </section>

        <aside class="space-y-6">
          <article class="rounded-2xl bg-white p-5 shadow-card dark:bg-slate-900">
            <h2 class="mb-4 text-lg font-semibold">Summary</h2>
            <dl class="space-y-3 text-sm">
              <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800">
                <dt>Total Income</dt>
                <dd id="totalIncomeDisplay" class="font-semibold">$0.00</dd>
              </div>
              <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800">
                <dt>Total Expenses</dt>
                <dd id="totalExpensesDisplay" class="font-semibold">$0.00</dd>
              </div>
              <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800">
                <dt>Remaining Balance</dt>
                <dd id="remainingBalanceDisplay" class="font-semibold">$0.00</dd>
              </div>
              <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800">
                <dt>Savings</dt>
                <dd id="savingsDisplay" class="font-semibold">$0.00</dd>
              </div>
              <div class="flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800">
                <dt>% Income Spent</dt>
                <dd id="percentSpentDisplay" class="font-semibold">0%</dd>
              </div>
            </dl>
          </article>

          <article class="rounded-2xl bg-white p-5 shadow-card dark:bg-slate-900">
            <h2 class="mb-3 text-lg font-semibold">Smart Insights</h2>
            <ul id="insightsList" class="space-y-2 text-sm text-slate-600 dark:text-slate-300"></ul>
          </article>
        </aside>
      </main>
    </div>

    <template id="categoryTemplate">
      <div class="category-item rounded-xl border border-slate-200 p-4 dark:border-slate-700">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <input type="text" class="category-name-input w-40 rounded-lg border border-slate-300 px-2 py-1 text-sm font-semibold dark:border-slate-700 dark:bg-slate-800" />
          </div>
          <button class="delete-category rounded-lg border border-rose-200 px-3 py-1 text-xs font-semibold text-rose-600 hover:bg-rose-50 dark:border-rose-900 dark:text-rose-400 dark:hover:bg-rose-900/20">Delete</button>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="space-y-1">
            <span class="block text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Amount</span>
            <input type="number" min="0" step="0.01" class="category-amount w-full rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" placeholder="0.00" />
          </label>
          <label class="space-y-1">
            <span class="block text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Note (optional)</span>
            <input type="text" class="category-note w-full rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" placeholder="e.g. lunch, bus pass" />
          </label>
        </div>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
